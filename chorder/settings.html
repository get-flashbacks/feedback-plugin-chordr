<div class="chorder-settings">
  <fieldset>
    <legend>Chord overlay</legend>

    <label>
      <input
        type="checkbox"
        data-setting="show_diagram"
        class="chorder-settings__show-diagram"
      />
      Show chord diagram alongside the chord name
    </label>
  </fieldset>

  <button class="chorder-settings__save-button" data-role="save-settings">
    Save Settings
  </button>
</div>

<script>
  (function () {
    const PLUGIN_ID = "chorder";
    const panel = document.querySelector(".chorder-settings");
    if (!panel) return;

    async function loadSettings() {
      try {
        const res = await fetch(`/api/plugins/${PLUGIN_ID}/settings`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const settings = await res.json();
        Object.entries(settings).forEach(([key, value]) => {
          const input = panel.querySelector(`[data-setting="${key}"]`);
          if (input && input.type === "checkbox") input.checked = value;
        });
      } catch (err) {
        console.warn(`${PLUGIN_ID}: could not load settings`, err);
      }
    }

    panel.addEventListener("click", async (e) => {
      if (e.target.dataset.role !== "save-settings") return;
      const formData = {};
      panel.querySelectorAll("[data-setting]").forEach((input) => {
        formData[input.dataset.setting] = input.checked;
      });
      try {
        const res = await fetch(`/api/plugins/${PLUGIN_ID}/settings`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
      } catch (err) {
        console.error(`${PLUGIN_ID}: failed to save settings`, err);
      }
    });

    loadSettings();
  })();
</script>
