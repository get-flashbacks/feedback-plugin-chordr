name: custom-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plugin manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifestPath = path.join('chordr', 'plugin.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.id !== 'chordr') throw new Error(`Expected plugin id "chordr", got ${JSON.stringify(manifest.id)}`);
          if (!manifest.script) throw new Error('plugin.json must declare a script');
          if (!fs.existsSync(path.join('chordr', manifest.script))) throw new Error(`Missing declared script: chordr/${manifest.script}`);
          NODE
      - name: Check JavaScript syntax
        run: node --check chordr/screen.js
      - name: Run all JavaScript tests
        run: |
          test -n "$(find tests -maxdepth 1 -name '*.test.js' -print -quit)"
          node --test tests/*.test.js

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
